name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - id: version
        run: cargo xtask tag-version
      - run: cargo xtask release preflight --version ${{ steps.version.outputs.version }}
  installers:
    needs: preflight
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-universal
            runner: macos-15
          - platform: android-arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config dpkg-dev
      - run: cargo xtask release build --platform ${{ matrix.platform }} --version ${{ needs.preflight.outputs.version }}
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
          WIN_TIMESTAMP_URL: ${{ vars.WIN_TIMESTAMP_URL }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_P12_BASE64: ${{ secrets.MAC_P12_BASE64 }}
          MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
          MAC_NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_KEY_BASE64 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VYNAMP_MAINTAINER: ${{ vars.VYNAMP_MAINTAINER }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [preflight, installers]
    environment: release-publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask release assemble --version ${{ needs.preflight.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: cargo xtask release publish-draft --version ${{ needs.preflight.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
