name: CI
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-22.04
    outputs:
      core: ${{ steps.detect.outputs.core }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask ci docs
      - id: detect
        run: cargo xtask ci detect
  tooling:
    needs: docs
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask ci docs
      - run: cargo clippy --package xtask --all-targets --locked -- -D warnings
  core:
    needs: docs
    if: needs.docs.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo xtask ci core --target ${{ matrix.target }}
  android:
    needs: docs
    if: needs.docs.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask ci android
  gate:
    name: CI Gate
    if: always()
    needs: [docs, tooling, core, android]
    runs-on: ubuntu-22.04
    steps:
      - env:
          DOCS: ${{ needs.docs.result }}
          TOOLING: ${{ needs.tooling.result }}
          CORE: ${{ needs.core.result }}
          ANDROID: ${{ needs.android.result }}
          HAS_CORE: ${{ needs.docs.outputs.core }}
          HAS_ANDROID: ${{ needs.docs.outputs.android }}
        shell: bash
        run: |
          test "$DOCS" = success
          test "$TOOLING" = success
          if [ "$HAS_CORE" = true ]; then test "$CORE" = success; fi
          if [ "$HAS_ANDROID" = true ]; then test "$ANDROID" = success; fi
          echo 'CI Gate passed; application source and hardware acceptance are separate.'
